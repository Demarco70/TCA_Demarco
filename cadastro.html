<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="CSS/main.css">
    <title>ProHabeas - Cadastro</title>
</head>

<body>

<header>
    <div class="topo">
        <img alt="Logo ProHabeas" src="Img/Logo Corporativo ProHabeas em Azul Gradiente.png">
    </div>
</header>

<main>
    <section>
        <h1>Cadastre-se</h1>

        <form class="formulario" id="form-cadastro">
            <label>
                E-mail
                <input type="email" id="email" autocomplete="email" required>
            </label>

            <label>
                Senha
                <input type="password" id="senha" autocomplete="new-password" minlength="6" required>
            </label>

            <label>
                Confirmar senha
                <input type="password" id="confirmar-senha" autocomplete="new-password" minlength="6" required>
            </label>

            <button class="botao" type="submit">Criar conta</button>
            <p class="mensagem" id="mensagem" role="status"></p>
        </form>

        <p class="texto-centro">Já tem conta? <a href="login.html">Entrar</a></p>
    </section>
</main>

<footer>
    <p>Desenvolvido por: Gabriel Demarco</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase.js"></script>
<script src="JS/cadastro.js"></script>
</body>
</html>
