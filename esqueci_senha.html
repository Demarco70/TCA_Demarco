<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="CSS/main.css">
    <title>Recuperar senha</title>
</head>
<body>
    
<header>
    <div class="topo">
        <img alt="Logo ProHabeas" src="Img/Logo Corporativo ProHabeas em Azul Gradiente.png">
    </div>
</header>

<main>
    <section>
        <h1>Recuperar senha</h1>

        <form class="formulario" id="form-recuperar">
            <label>E-mail
                <input type="email" id="email" placeholder="Seu e-mail" required />
            </label>
        
            <button class="botao" type="submit">Recuperar senha</button>
            <p id="msg" class="mensagem" role="status"></p>
        </form>

        <p class="texto-centro">Voltar para a página anterior? <a href="login.html">Voltar ao login</a></p>
    </section>
</main>    

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase.js"></script>
<script src="JS/esqueci_senha.js"></script>
</body>
</html>
