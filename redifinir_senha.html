<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="CSS/main.css">
    <title>Redefinir senha</title>
</head>
<body>

<header>
    <div class="topo">
        <img alt="Logo ProHabeas" src="Img/Logo Corporativo ProHabeas em Azul Gradiente.png">
    </div>
</header>

<main>

<p id="aviso_link_senha">Um link de recuperação foi enviado ao seu email</p>

<form id="form-nova-senha" style="display:none">
  <input type="password" id="nova-senha" placeholder="Nova senha" minlength="6" required />
  <input type="password" id="confirmar-senha" placeholder="Confirmar nova senha" minlength="6" required />
  <button type="submit">Salvar nova senha</button>
  <p id="msg-senha"></p>
</form>

<p><a href="esqueci_senha.html">Solicitar um novo link de recuperação</a></p>

</main>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase.js"></script>
<script src="JS/redefinir_senha.js"></script>
</body>
</html>
