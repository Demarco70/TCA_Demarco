<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="CSS/main.css">
    <title>Redefinir senha</title>
</head>
<body>

<header>
    <div class="topo">
        <img alt="Logo ProHabeas" src="Img/Logo Corporativo ProHabeas em Azul Gradiente.png">
    </div>
</header>

<main>
    <section>
        <h1>Criar nova senha</h1>

        <p id="aviso-link">Validando seu link de recuperação...</p>

        <form class="formulario" id="form-nova-senha" style="display: none">
            <label>
                Senha nova
                <input type="password" id="nova-senha" placeholder="Nova senha" minlength="6" required />
            </label>

            <label>
                Confirmar senha
                <input type="password" id="confirmar-senha" placeholder="Confirmar nova senha" minlength="6" required />
            </label>
  
            <button class="botao" type="submit">Salvar senha nova</button>
            <p class="mensagem" id="msg-senha" role="status"></p>
        </form>
    </section>
</main>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase.js"></script>
<script src="JS/redefinir_senha.js"></script>
</body>
</html>
